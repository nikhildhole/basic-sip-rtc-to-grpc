name: Release

on:
  push:
    branches:
      - main
      - dev

jobs:
  semantic-release:
    runs-on: ubuntu-latest
    outputs:
      new_version: ${{ steps.version.outputs.version }}
      tag_exists: ${{ steps.check_tag.outputs.exists }}
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Set Branch Type
        id: branch_info
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "type=main" >> $GITHUB_OUTPUT
          else
            echo "type=dev" >> $GITHUB_OUTPUT
          fi

      - name: Determine Next Version
        id: version
        run: |
          python3 scripts/determine_version.py ${{ steps.branch_info.outputs.type }} > version.txt
          VERSION=$(cat version.txt)
          echo "Calculated version: $VERSION"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Check if Tag Exists
        id: check_tag
        run: |
          VERSION=${{ steps.version.outputs.version }}
          if git rev-parse "$VERSION" >/dev/null 2>&1; then
            echo "Tag $VERSION already exists."
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Push Tag
        if: steps.check_tag.outputs.exists == 'false'
        run: |
          VERSION=${{ steps.version.outputs.version }}
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git tag $VERSION
          git push origin $VERSION

  build-release:
    needs: semantic-release
    if: needs.semantic-release.outputs.tag_exists == 'false'
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact_name: win64
            cpack_gen: ZIP
          - os: ubuntu-latest
            artifact_name: linux-deb
            cpack_gen: DEB
          # - os: ubuntu-latest
          #   artifact_name: linux-rpm
          #   cpack_gen: RPM # RPM requires rpmbuild
          - os: macos-latest
            artifact_name: macos
            cpack_gen: DragNDrop

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v3

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler libprotobuf-dev libgrpc++-dev protobuf-compiler-grpc build-essential cmake

      - name: Install dependencies (Mac)
        if: runner.os == 'macOS'
        run: |
          brew install protobuf grpc cmake

      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        run: |
          vcpkg install grpc protobuf --triplet x64-windows
          vcpkg integrate install

      - name: Configure CMake
        run: |
          cmake -B build -S . -DPROJECT_VERSION=${{ needs.semantic-release.outputs.new_version }} -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE=${{ runner.os == 'Windows' && '$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake' || '' }}

      - name: Build
        run: cmake --build build --config Release

      - name: Package
        run: |
          cd build
          cpack -G ${{ matrix.cpack_gen }} -C Release

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ needs.semantic-release.outputs.new_version }}
          files: build/*.*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
